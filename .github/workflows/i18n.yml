name: i18n

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: i18n-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: locale parity + i18n unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails when any locale's key set diverges from en.json.
      - name: Check locale parity
        run: npm run i18n:check

      # Unit tests cover the parity assertion, the coverage panel, and
      # locale-aware number/date formatting.
      - name: Run unit tests
        run: npm test
